# Workflow for building and deploying Jekyll site to a remote server via rsync/SSH (or GitHub Pages for forks)
name: deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to prevent race conditions during sync
concurrency:
  group: ${{ vars.REMOTE_HOST != '' && 'deploy' || 'pages' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        if: ${{ vars.REMOTE_HOST == '' }}
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: |
          CONFIG_FLAGS="_config.yml"
          for extra in _config.pages.yml _config_pages.yml _config.local.yml _config_local.yml; do
            if [ -f "$extra" ]; then
              CONFIG_FLAGS="${CONFIG_FLAGS},${extra}"
            fi
          done
          if [ -n "${{ steps.pages.outputs.base_path }}" ]; then
            bundle exec jekyll build --config "$CONFIG_FLAGS" --baseurl "${{ steps.pages.outputs.base_path }}"
          else
            bundle exec jekyll build --config "$CONFIG_FLAGS"
          fi
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        if: ${{ vars.REMOTE_HOST == '' }}
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to remote server via rsync
        if: ${{ vars.REMOTE_HOST != '' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR }}
          REMOTE_PORT: ${{ vars.REMOTE_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "${REMOTE_PORT:-22}" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -p ${REMOTE_PORT:-22}" _site/ "$REMOTE_USER@$REMOTE_HOST:$REMOTE_DIR/"

  deploy-pages:
    if: ${{ vars.REMOTE_HOST == '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

